<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bal Parayan Smruti</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #f0e6d3;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding: 0.8rem 0.7rem;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid #ddc49a;
      box-shadow: 0 4px 20px rgba(160,110,60,0.15);
    }

    /* ── Header ── */
    .card-header {
      background: #faebd7;
      padding: 1rem 1rem 0;
      text-align: center;
    }

    .org-label {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #b07840;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .title-en {
      font-size: 1.6rem;
      font-weight: 800;
      color: #1e1008;
      line-height: 1.15;
    }

    .title-en span {
      color: #c8622a;
    }

    .title-gu {
      font-size: 0.8rem;
      color: #9a6a3a;
      margin-top: 0.15rem;
      font-weight: 500;
    }

    .diya {
      font-size: 1.4rem;
      display: block;
      margin: 0.5rem 0 0;
    }

    /* ── Arch border ── */
    .arch-border {
      width: 100%;
      line-height: 0;
      background: #faebd7;
    }

    .arch-border svg {
      display: block;
      width: 100%;
      height: 20px;
    }

    /* ── Video — takes maximum space ── */
    .video-wrapper {
      width: 100%;
      background: #000;
      position: relative;
    }

    .video-wrapper video {
      display: block;
      width: 100%;
      height: auto;
      min-height: 220px;
      max-height: 55vh;
      object-fit: contain;
      background: #000;
    }

    /* ── Caption ── */
    .caption {
      background: #faebd7;
      border-top: 1px solid #e8d4b0;
      padding: 0.7rem 1rem 0.8rem;
      text-align: center;
    }

    .caption p {
      font-size: 0.78rem;
      color: #7a5030;
      line-height: 1.5;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Header -->
    <div class="card-header">
      <p class="org-label">BAPS Swaminarayan Sanstha</p>
      <h1 class="title-en">Bal Parayan <span>Smruti</span></h1>
      <p class="title-gu">બાળ પારાયણ સ્મૃતિ</p>
      <span class="diya">🪔</span>
    </div>

    <!-- Arch border -->
    <div class="arch-border">
      <svg viewBox="0 0 400 20" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0,0 Q10,20 20,0 Q30,20 40,0 Q50,20 60,0 Q70,20 80,0 Q90,20 100,0 Q110,20 120,0 Q130,20 140,0 Q150,20 160,0 Q170,20 180,0 Q190,20 200,0 Q210,20 220,0 Q230,20 240,0 Q250,20 260,0 Q270,20 280,0 Q290,20 300,0 Q310,20 320,0 Q330,20 340,0 Q350,20 360,0 Q370,20 380,0 Q390,20 400,0 L400,20 L0,20 Z"
          fill="#c8a06a" opacity="0.35"/>
        <path d="M0,0 Q10,20 20,0 Q30,20 40,0 Q50,20 60,0 Q70,20 80,0 Q90,20 100,0 Q110,20 120,0 Q130,20 140,0 Q150,20 160,0 Q170,20 180,0 Q190,20 200,0 Q210,20 220,0 Q230,20 240,0 Q250,20 260,0 Q270,20 280,0 Q290,20 300,0 Q310,20 320,0 Q330,20 340,0 Q350,20 360,0 Q370,20 380,0 Q390,20 400,0"
          fill="none" stroke="#c8a06a" stroke-width="1.5"/>
      </svg>
    </div>

    <!-- Video -->
    <div class="video-wrapper">
      <video
        controls
        preload="metadata"
        aria-label="Bal Parayan Smruti Video"
      >
        <source src="https://archive.org/download/bal-parayan-zalak/Bal%20Parayan%20Zalak.mp4" type="video/mp4" />
        Your browser does not support the HTML5 video tag.
      </video>
    </div>

    <!-- Caption -->
    <div class="caption">
      <p>A recording of the parayan, kept for the children who took part.</p>
    </div>

  </div>

</body>
</html>

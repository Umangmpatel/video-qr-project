<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bal Parayan Smruti</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #f0e6d3;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
    }

    /* ── Card ── */
    .card {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      border-radius: 0;
      overflow: hidden;
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .card-header {
      background: #faebd7;
      padding: 0.8rem 1rem 0;
      text-align: center;
      flex-shrink: 0;
    }

    .org-label {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #b07840;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .title-en {
      font-size: 1.4rem;
      font-weight: 800;
      color: #1e1008;
      line-height: 1.1;
    }

    .title-en span {
      color: #c8622a;
    }

    .title-gu {
      font-size: 0.75rem;
      color: #9a6a3a;
      margin-top: 0.12rem;
      font-weight: 500;
    }

    .diya {
      font-size: 1.2rem;
      display: block;
      margin: 0.35rem 0 0;
    }

    /* ── Arch border ── */
    .arch-border {
      width: 100%;
      line-height: 0;
      background: #faebd7;
      flex-shrink: 0;
    }

    .arch-border svg {
      display: block;
      width: 100%;
      height: 16px;
    }

    /* ── Video — takes remaining space ── */
    .video-wrapper {
      flex: 1;
      width: 100%;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* ── Caption — overlaid at bottom of video ── */
    .caption {
      position: absolute;
      bottom: 52px;   /* above the native video controls bar */
      left: 0;
      right: 0;
      text-align: center;
      padding: 0.35rem 0.8rem;
      background: rgba(250, 235, 215, 0.82);
      pointer-events: none;
    }

    .caption p {
      font-size: 0.7rem;
      color: #7a5030;
      line-height: 1.3;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Header -->
    <div class="card-header">
      <p class="org-label">BAPS Swaminarayan Sanstha</p>
      <h1 class="title-en">Bal Parayan <span>Smruti</span></h1>
      <p class="title-gu">બાળ પારાયણ સ્મૃતિ</p>
      <span class="diya">🪔</span>
    </div>

    <!-- Arch border -->
    <div class="arch-border">
      <svg viewBox="0 0 400 20" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0,0 Q10,20 20,0 Q30,20 40,0 Q50,20 60,0 Q70,20 80,0 Q90,20 100,0 Q110,20 120,0 Q130,20 140,0 Q150,20 160,0 Q170,20 180,0 Q190,20 200,0 Q210,20 220,0 Q230,20 240,0 Q250,20 260,0 Q270,20 280,0 Q290,20 300,0 Q310,20 320,0 Q330,20 340,0 Q350,20 360,0 Q370,20 380,0 Q390,20 400,0 L400,20 L0,20 Z"
          fill="#c8a06a" opacity="0.35"/>
        <path d="M0,0 Q10,20 20,0 Q30,20 40,0 Q50,20 60,0 Q70,20 80,0 Q90,20 100,0 Q110,20 120,0 Q130,20 140,0 Q150,20 160,0 Q170,20 180,0 Q190,20 200,0 Q210,20 220,0 Q230,20 240,0 Q250,20 260,0 Q270,20 280,0 Q290,20 300,0 Q310,20 320,0 Q330,20 340,0 Q350,20 360,0 Q370,20 380,0 Q390,20 400,0"
          fill="none" stroke="#c8a06a" stroke-width="1.5"/>
      </svg>
    </div>

    <!-- Video -->
    <div class="video-wrapper">
      <video
        controls
        preload="metadata"
        aria-label="Bal Parayan Smruti Video"
      >
        <source src="https://archive.org/download/bal-parayan-zalak/Bal%20Parayan%20Zalak.mp4" type="video/mp4" />
        Your browser does not support the HTML5 video tag.
      </video>
    </div>



  </div>

</body>
</html>

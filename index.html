<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Video Page</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    .header {
      width: 100%;
      padding: 1.2rem 1rem 0.8rem;
      text-align: center;
      background: linear-gradient(180deg, #111 0%, #0a0a0a 100%);
    }

    h1 {
      font-size: clamp(1.3rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #ffffff;
    }

    h1 span {
      color: #4f9eff;
    }

    /* ── Video — full width on mobile ── */
    .video-wrapper {
      width: 100%;
      max-width: 900px;
      background: #000;
      /* No border-radius on mobile so it goes edge to edge */
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.7);
    }

    .video-wrapper iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
    }

    /* ── Info bar below video ── */
    .info {
      width: 100%;
      max-width: 900px;
      padding: 0.9rem 1rem;
      background: #111;
      border-top: 1px solid #222;
    }

    .info p {
      font-size: 0.82rem;
      color: #888;
      text-align: center;
      line-height: 1.5;
    }

    /* ── Desktop: add rounded corners ── */
    @media (min-width: 600px) {
      body {
        padding: 2rem 1rem;
        justify-content: center;
      }

      .video-wrapper {
        border-radius: 12px;
      }

      .info {
        border-radius: 0 0 12px 12px;
        border-top: none;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Watch My <span>Video</span></h1>
  </div>

  <div class="video-wrapper">
    <iframe
      src="https://drive.google.com/file/d/1kpw-Vf2JztkORSnQ8dcZ_FjDTnwEv1B1/preview"
      allow="autoplay"
      allowfullscreen
      aria-label="Video player"
    ></iframe>
  </div>

  <div class="info">
    <p>Scan the QR code to open this page on your phone.</p>
  </div>

</body>
</html>

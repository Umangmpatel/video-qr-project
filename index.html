<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bal Parayan Smruti</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #f0e6d3;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Main card ── */
    .card {
      width: calc(100% - 1.6rem);
      max-width: 480px;
      margin: 1.2rem 0.8rem 0.8rem;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(160,110,60,0.18);
    }

    /* ── Header ── */
    .card-header {
      background: #faebd7;
      padding: 1.2rem 1rem 0;
      text-align: center;
      border: 1.5px solid #ddc49a;
      border-bottom: none;
      border-radius: 18px 18px 0 0;
    }

    .org-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #b07840;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .title-en {
      font-size: 1.75rem;
      font-weight: 800;
      color: #1e1008;
      line-height: 1.15;
    }

    .title-en span {
      color: #c8622a;
    }

    .title-gu {
      font-size: 0.82rem;
      color: #9a6a3a;
      margin-top: 0.2rem;
      font-weight: 500;
    }

    .diya {
      font-size: 1.5rem;
      display: block;
      margin: 0.6rem 0 0;
    }

    /* ── Decorative arch/wave border ── */
    .arch-border {
      width: 100%;
      line-height: 0;
      background: #faebd7;
      border-left: 1.5px solid #ddc49a;
      border-right: 1.5px solid #ddc49a;
    }

    .arch-border svg {
      display: block;
      width: 100%;
    }

    /* ── Video ── */
    .video-wrapper {
      width: 100%;
      background: #111;
      border-left: 1.5px solid #ddc49a;
      border-right: 1.5px solid #ddc49a;
      overflow: hidden;
    }

    .video-wrapper iframe {
      display: block;
      width: 100%;
      aspect-ratio: 9 / 16;
      border: none;
    }

    /* ── Caption ── */
    .caption {
      background: #faebd7;
      border: 1.5px solid #ddc49a;
      border-top: none;
      border-radius: 0 0 18px 18px;
      padding: 0.85rem 1rem 1rem;
      text-align: center;
    }

    .caption p {
      font-size: 0.8rem;
      color: #7a5030;
      line-height: 1.6;
      font-style: italic;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 0.8rem;
      margin-bottom: 1.5rem;
      font-size: 0.72rem;
      color: #b09070;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Header -->
    <div class="card-header">
      <p class="org-label">BAPS Swaminarayan Sanstha</p>
      <h1 class="title-en">Bal Parayan <span>Smruti</span></h1>
      <p class="title-gu">બાળ પારાયણ સ્મૃતિ</p>
      <span class="diya">🪔</span>
    </div>

    <!-- Decorative arch border (like reference image) -->
    <div class="arch-border">
      <svg viewBox="0 0 400 28" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <!-- Arch bumps pointing UP from the header -->
        <path d="M0,28
          Q10,4 20,28
          Q30,4 40,28
          Q50,4 60,28
          Q70,4 80,28
          Q90,4 100,28
          Q110,4 120,28
          Q130,4 140,28
          Q150,4 160,28
          Q170,4 180,28
          Q190,4 200,28
          Q210,4 220,28
          Q230,4 240,28
          Q250,4 260,28
          Q270,4 280,28
          Q290,4 300,28
          Q310,4 320,28
          Q330,4 340,28
          Q350,4 360,28
          Q370,4 380,28
          Q390,4 400,28
          L400,28 L0,28 Z"
          fill="#faebd7" stroke="#ddc49a" stroke-width="1.2"/>
      </svg>
    </div>

    <!-- Video -->
    <div class="video-wrapper">
      <iframe
        src="https://drive.google.com/file/d/1kpw-Vf2JztkORSnQ8dcZ_FjDTnwEv1B1/preview"
        allow="autoplay"
        allowfullscreen
        aria-label="Bal Parayan Smruti Video"
      ></iframe>
    </div>

    <!-- Caption -->
    <div class="caption">
      <p>A recording of the parayan, kept for the children who took part.</p>
    </div>

  </div>

  <div class="footer">
    <p>Scan the QR code to open this page on your phone.</p>
  </div>

</body>
</html>
